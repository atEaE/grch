name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${version}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run:
          cargo build --release --target ${{ matrix.target }}
      - run:
          cp target/${{ matrix.target }}/release/grch${{ matrix.ext }} grch-${{ matrix.target }}${{ matrix.ext }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with: 
          name: grch-${{ matrix.target }}
          path: grch-${{ matrix.target }}${{ matrix.ext }}
      

  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify.outputs.tag }}" dist/* \
            --draft \
            --title "${{ needs.verify.outputs.tag }}" \
            --generate-notes