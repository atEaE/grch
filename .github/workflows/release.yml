name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Release must run from main (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${version}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run:
          cargo build --release --target ${{ matrix.target }}
      - name: Build MSI
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix
          cargo wix --no-build --nocapture --target ${{ matrix.target }} -o grch-${{ matrix.target }}.msi
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf grch-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release grch
      - name: Package (zip)
        if: runner.os == 'Windows'
        run: 7z a grch-${{ matrix.target }}.zip ./target/${{ matrix.target }}/release/grch.exe
      - uses: actions/upload-artifact@v7
        with: 
          name: grch-${{ matrix.target }}
          path: grch-${{ matrix.target }}.*
      
  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify.outputs.tag }}" dist/* \
            --draft \
            --title "${{ needs.verify.outputs.tag }}" \
            --generate-notes