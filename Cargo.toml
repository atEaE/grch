[package]
name = "grch"
version = "0.3.0"
edition = "2024"
description = "game rom CRC32 check tool"
license = "MIT"
authors = [
	"atEaE"
]
repository = "https://github.com/atEaE/grch"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
crc32fast = "1.5.0"
dirs = "6.0.0"
glob = "0.3.4"
regex = "1.13.1"
tempfile = "3.27.0"
ureq = "3.4.0"
